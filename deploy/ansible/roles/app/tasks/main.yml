---
- name: Create app deployment directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy project files to Raspberry Pi
  synchronize:
    src: "{{ playbook_dir }}/../../"
    dest: "{{ app_dir }}"
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.git"
      - "--exclude=apps/mobile/.expo"
      - "--exclude=apps/mobile/node_modules"
      - "--exclude=apps/server/node_modules"

- name: Template .env file
  template:
    src: env.j2
    dest: "{{ app_dir }}/deploy/docker/.env"
    mode: '0600'

- name: Build and deploy containers with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/deploy/docker"
    files:
      - "{{ compose_file | default('docker-compose.prod.yml') }}"
    state: present
    build: always
    pull: missing
