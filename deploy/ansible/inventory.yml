---
# Host connection info comes from deploy/ansible/.env (HOST, SSH_USER,
# SSH_KEY) — Ansible's plain INI inventory format can't template
# lookup('env', ...) in host vars, only YAML inventories can. Load .env into
# your shell before running any ansible command against this inventory:
#   set -a && source deploy/ansible/.env && set +a
app_host:
  hosts:
    server:
      ansible_host: "{{ lookup('env', 'HOST') }}"
      ansible_user: "{{ lookup('env', 'SSH_USER') | default('deploy', true) }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY') | default(omit) }}"
