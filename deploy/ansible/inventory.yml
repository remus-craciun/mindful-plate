---
# Host connection info comes from deploy/ansible/.env (PI_HOST, PI_SSH_USER,
# PI_SSH_KEY) — Ansible's plain INI inventory format can't template
# lookup('env', ...) in host vars, only YAML inventories can. Load .env into
# your shell before running any ansible command against this inventory:
#   set -a && source deploy/ansible/.env && set +a
raspberrypi:
  hosts:
    pi-server:
      ansible_host: "{{ lookup('env', 'PI_HOST') }}"
      ansible_user: "{{ lookup('env', 'PI_SSH_USER') | default('pi', true) }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'PI_SSH_KEY') | default(omit) }}"
