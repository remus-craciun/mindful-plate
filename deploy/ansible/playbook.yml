---
# Minimal deploy: ssh to the host, pull the code, build a Docker image, run
# it as a container. Does not install or remove any software on the host —
# Docker and Postgres are assumed to already be set up there.
- name: Deploy Mindful Plate
  hosts: app_host
  vars:
    app_dir: "/home/{{ ansible_user }}/mindful-plate"
    image_name: mindful-plate
    # Sourced from the environment — see deploy/ansible/.env.example.
    # Load it into your shell before running this playbook:
    #   set -a && source deploy/ansible/.env && set +a
    git_repo: "{{ lookup('env', 'GIT_REPO_URL') | default('https://github.com/remus-craciun/mindful-plate.git', true) }}"
    git_branch: "{{ lookup('env', 'GIT_BRANCH') | default('main', true) }}"
    database_url: "{{ lookup('env', 'DATABASE_URL') | default('', true) }}"
    jwt_secret: "{{ lookup('env', 'JWT_SECRET') | default('', true) }}"
    gemini_api_key: "{{ lookup('env', 'GEMINI_API_KEY') | default('', true) }}"

  pre_tasks:
    - name: Ensure required secrets were provided via the environment
      assert:
        that:
          - database_url | length > 0
          - jwt_secret | length >= 32
        fail_msg: >-
          DATABASE_URL and a JWT_SECRET (32+ characters) must be set before
          deploying. Copy deploy/ansible/.env.example to deploy/ansible/.env,
          fill in real values, then run:
          set -a && source deploy/ansible/.env && set +a
        success_msg: "Required secrets present."

  tasks:
    - name: Pull latest code (clones on first run)
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ git_branch }}"
        force: yes

    - name: Remove existing "previous"-tagged image, if any
      ansible.builtin.command: docker rmi {{ image_name }}:previous
      register: rmi_previous
      failed_when: false
      changed_when: rmi_previous.rc == 0

    - name: Re-tag current "latest" as "previous" (no-op on first deploy)
      ansible.builtin.command: docker tag {{ image_name }}:latest {{ image_name }}:previous
      register: tag_previous
      failed_when: false
      changed_when: tag_previous.rc == 0

    - name: Build new image, tagged latest
      ansible.builtin.command: docker build -f apps/server/Dockerfile -t {{ image_name }}:latest .
      args:
        chdir: "{{ app_dir }}"

    - name: Stop and remove the existing container
      ansible.builtin.command: docker rm -f {{ image_name }}
      register: rm_container
      failed_when: false
      changed_when: rm_container.rc == 0

    - name: Start the new container
      # List form: each argument is passed literally, with no shell
      # invocation and no whitespace-splitting — a secret containing a
      # space or shell-special character can't break or misparse the
      # command the way it could inside a single interpolated string.
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - "{{ image_name }}"
          - --restart
          - unless-stopped
          - --add-host=host.docker.internal:host-gateway
          - -p
          - "3000:3000"
          - -e
          - NODE_ENV=production
          - -e
          - PORT=3000
          - -e
          - HOST=0.0.0.0
          - -e
          - "DATABASE_URL={{ database_url }}"
          - -e
          - "JWT_SECRET={{ jwt_secret }}"
          - -e
          - "GEMINI_API_KEY={{ gemini_api_key }}"
          - "{{ image_name }}:latest"
